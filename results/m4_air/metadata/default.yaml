# RAMS default configuration
# Override any field via CLI args or by copying this file.

monitor:
  hz: 10.0                  # resource sampling frequency
  gpu_util_weight: 0.20     # applies only when accelerator telemetry exists
  gpu_memory_weight: 0.10   # applies only when accelerator telemetry exists

policy:
  default: safety           # legacy aliases remain supported; paper names are documented separately

  threshold:
    lo_thresh: 0.43         # R(t) below this → MEDIUM, Uncalibrated 0.45, Calibrated 0.30
    hi_thresh: 0.68         # R(t) above this → NANO, Uncalibrated 0.72. Calibrated 0.55
    hysteresis_window: 3    # consecutive samples before tier commits

  predictive:
    history_len: 20
    alpha: 0.35             # EWMA smoothing
    lo_thresh: 0.38
    hi_thresh: 0.63
    use_lstm: false              # requires PyTorch

  safety:
    lo_thresh: 0.43
    hi_thresh: 0.68
    hysteresis_window: 3
    proximity_window_s: 0.5  # VRU lock window (seconds)
    min_conf: 0.25            # minimum detection confidence for VRU retention

  safety2:
    lo_thresh: 0.43
    hi_thresh: 0.68
    hysteresis_window: 3
    proximity_window_s: 0.5  # VRU override hold time
    min_conf: 0.25
    near_area_fraction: 0.02 # normalized source-image bbox area; 8000/640^2 ~= 0.02

models:
  simulate: false            # set true to skip real model loading
  tiers:
    nano:
      model_id: yolov8n.pt
      latency_mean_ms: 18.0
      latency_std_ms: 2.5      # calibrated Gaussian noise for simulation
    small:
      model_id: yolov8s.pt
      latency_mean_ms: 32.0
      latency_std_ms: 4.0       # calibrated Gaussian noise for simulation
    medium:
      model_id: yolov8m.pt
      latency_mean_ms: 58.0
      latency_std_ms: 6.5       # calibrated Gaussian noise for simulation

benchmark:
  n_inferences: 100
  load_profiles:
    - idle
    - light
    - moderate
    - heavy
    - burst
